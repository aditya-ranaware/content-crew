databases:
  - name: content-crew-db
    plan: free            # free Postgres expires after 30 days

services:
  - type: web
    name: content-crew
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free            # 512 MB RAM. If it runs out of memory, change to: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: content-crew-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false       # you type this in the Render dashboard
      - key: GEMINI_MODELS
        value: gemini-3.5-flash,gemini-3.7-flash,gemini-3.8-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash-lite